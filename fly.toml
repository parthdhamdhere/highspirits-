# fly.toml app configuration file generated for highspirits-api on 2026-10-30T00:37:51+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'highspirits-api'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile.backend'

[env]
  HOST = '0.0.0.0'
  NODE_ENV = 'staging'
  PAYMENT_MODE = 'demo'
  PORT = '4000'
  SEED_DEMO = 'true'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
